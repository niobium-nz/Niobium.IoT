name: '1.0$(Rev:.r)'
trigger:
- master

variables:
  buildAgentVmImage: 'windows-latest'
  serviceConnection: 'Sponsorship'
  resourceGroupName: 'cod-devices-provisioning'

pool:
  vmImage: $(buildAgentVmImage)

resources: 
  repositories:
  - repository: devops
    type: git
    name: cod/Cod.Infrastructures
    ref: main

stages:
- stage: Production
  jobs:
  - template: pipelines/jobs/GenericDotnetBuild.yml@devops
    parameters:
      nugetVSTSFeedID: 'cod/cod'
      projectToPublish: '**/Cod.Platform.Devices.Provisioning.Functions.csproj'

  - template: pipelines/jobs/FunctionAppInfrastructure.yml@devops
    parameters:
      azureServiceConnection: $(serviceConnection)
      resourceGroupName: $(resourceGroupName)
      appNamePrefix: 'CodDevicesProv'
      enableKeyVault: true
      enableStagingSlot: true
      checkoutDevopsStep:
        checkout: devops
        
  - job: IoT
    dependsOn:
      - Infrastructure
    condition: succeeded()
    pool:
      vmImage: $(buildAgentVmImage)
    steps:
    - checkout: devops
    - template: pipelines/steps/newIoTHub.yml@devops
      parameters:
        azureServiceConnection: $(serviceConnection)
        resourceGroupName: $(resourceGroupName)
        iotHubName: 'CodIoTHub'
        primaryCert: ''
        secondaryCert: ''

  - job: Configuration
    dependsOn:
      - IoT
      - Infrastructure
    condition: succeeded()
    pool:
      vmImage: $(buildAgentVmImage)
    variables:
      functionAppName: $[dependencies.Infrastructure.outputs['infrastructureOutputs.functionAppName']]
      functionAppHostname: $[dependencies.Infrastructure.outputs['infrastructureOutputs.functionAppHostname']]
      iotHubHostName: $[dependencies.IoT.outputs['newIoTHubOutputs.hostName']]
      keyVaultUrl: $[dependencies.Infrastructure.outputs['infrastructureOutputs.keyVaultUrl']]
      applicationInsightsInstrumentationKey: $[dependencies.Infrastructure.outputs['infrastructureOutputs.applicationInsightsInstrumentationKey']]
    steps:
    - checkout: none
    - task: AzureAppServiceSettings@1
      displayName: 'Update AppSettings'
      inputs:
        azureSubscription: $(serviceConnection)
        appName: $(functionAppName)
        resourceGroupName: $(resourceGroupName)
        appSettings: |
          [
            {
              "name": "IOT_HUB_HOSTNAME",
                "value": "$(iotHubHostName)",
              "slotSetting": false
            },
            {
              "name": "DEVICE_ID_SECRET",
              "value": "@Microsoft.KeyVault(SecretUri=$(keyVaultUrl)/secrets/DEVICE-ID-SECRET/)",
              "slotSetting": false
            },
            {
              "name": "DEVICE_PIN_SECRET",
              "value": "@Microsoft.KeyVault(SecretUri=$(keyVaultUrl)/secrets/DEVICE-PIN-SECRET/)",
              "slotSetting": false
            }
          ]
      
  - template: pipelines/jobs/FunctionAppDeploy.yml@devops
    parameters:
      serviceConnection: $(serviceConnection)
      resourceGroupName: $(resourceGroupName)
