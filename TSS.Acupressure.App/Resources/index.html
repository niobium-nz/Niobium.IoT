<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Device WiFi Provisioning</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="provisioning-container">
        <h2>Connect Your Device to WiFi</h2>

        <!-- Loading Indicator for Networks -->
        <div id="loading-networks" class="loading-indicator">Loading networks...</div>

        <form id="wifi-form" style="display: none;">
            <div class="form-group">
                <label for="ssid">Available Networks:</label>
                <select id="ssid" name="ssid" required>
                    <!-- Options will be populated dynamically -->
                </select>
            </div>
            <div class="form-group">
                <label for="password">Network Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter Password" required>
            </div>
            <div class="form-group">
                <label for="pin">Device PIN:</label>
                <input type="password" id="pin" name="pin" placeholder="Enter Device PIN" required>
            </div>
            <button type="submit">Connect</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
